name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cache-nix-action manages and purges caches through the GitHub Actions REST
# API, which needs actions: write — the default GITHUB_TOKEN is read-only, and
# without this the store is never persisted ("Resource not accessible by
# integration") and every run cold-misses. contents: read covers checkout.
permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # Keep build outputs and .drv files in the store so the dev shell's
          # closure persists and can be cached by the step below.
          extra_nix_config: |
            keep-outputs = true
            keep-derivations = true

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      # Restore and save /nix/store in one step (saves in the post-job phase),
      # keyed on the Nix inputs so it invalidates when the flake or lock moves.
      # The win here is devenv's python venv: languages.python.venv pip-installs
      # pebble-tool at build time, so that derivation is on no upstream cache
      # and is rebuilt from scratch on every cold run.
      #
      # gc-max-store-size is 6G rather than the 1G used elsewhere because this
      # shell is genuinely that big: on x86_64-linux clang-tools alone closes
      # over 2.0G and ffmpeg 1.0G, and with imagemagick/nodejs/python, the flake
      # inputs and the devenv machinery the store lands around 4-4.5G. The cap
      # is deliberately set ABOVE that so the collection is a no-op — `nix
      # develop` leaves most of its closure unrooted once the command exits, so
      # a GC that actually ran would evict arbitrary parts of the shell and the
      # next run would rebuild them anyway.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-ci-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-ci-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-ci-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Run pre-commit hooks
        run: nix develop --impure --command prek run --all-files
